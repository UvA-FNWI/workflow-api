name: Build and deploy - PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: self-hosted
    environment:
      name: pr-${{ github.event.number }}
      url: https://workflow-api-pr-${{ github.event.number }}.datanose.nl/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create milestones-config token
        id: milestones-config-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MILESTONES_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.MILESTONES_CONFIG_APP_PRIVATE_KEY }}
          owner: UvA-FNWI
          repositories: milestones-config
        
      - name: Build and deploy
        env:
          PR_NUMBER: ${{ github.event.number }}
          UPDATER_SECRET: ${{ secrets.UPDATER_SECRET_DN }}
          MILESTONES_CONFIG_TOKEN: ${{ steps.milestones-config-token.outputs.token }}
          DESCR: ${{ github.event.pull_request.body }}
        run: |
          set -euxo pipefail
          TAG="pr-${PR_NUMBER}"
          docker build -f UvA.Workflow.Api/Dockerfile -t "datanosecr.azurecr.io/workflow-api:${TAG}" .
          docker push "datanosecr.azurecr.io/workflow-api:${TAG}"
          VERSION=$(date "+1.0.%Y%m%d%H%M%S")
          helm package --version "${VERSION}" --app-version "${VERSION}" Deployment/workflow-api-pr
          helm push "workflow-api-pr-${VERSION}.tgz" oci://datanosecr.azurecr.io/helm
          config_ref=main
          if [[ "$DESCR" =~ milestones-config/pull/([0-9]+) ]]; then
            config_ref="refs/pull/${BASH_REMATCH[1]}/head"
            set +x
            git ls-remote --exit-code \
              "https://x-access-token:${MILESTONES_CONFIG_TOKEN}@github.com/UvA-FNWI/milestones-config.git" \
              "$config_ref" >/dev/null
            set -x
          fi
          curl --fail --no-progress-meter --get \
            --data-urlencode "name=workflow-api-pr" \
            --data-urlencode "secret=${UPDATER_SECRET}" \
            --data-urlencode "version=${VERSION}" \
            --data-urlencode "id=${PR_NUMBER}" \
            --data-urlencode "target=${config_ref}" \
            "https://api-v2-tst.datanose.nl/gitops-updater"
