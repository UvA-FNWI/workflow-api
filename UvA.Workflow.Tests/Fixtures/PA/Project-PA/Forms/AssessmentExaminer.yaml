name: AssessmentExaminer
title:
  en: Assessment (examiner)
  nl: Beoordeling (examinator)

pages:
  - name: Declarations
    title:
      en: Declarations
      nl: Verklaringen
    elements:
      - text:
          en: Please review the plagiarism report generated by Turnitin before continuing.
          nl: Bekijk het door Turnitin gegenereerde plagiaatrapport voordat je verdergaat.
      - question: PlagiarismReportUrl
      - question: FraudChecked

  - name: Product
    title:
      en: Product
      nl: Product
    elements:
      - question: ProductAbstract
      - question: ProductIntroduction
      - question: ProductMethods
      - question: ProductResults
      - question: ProductDiscussionConclusion
      - question: ProductReadability
      - question: ProductComments

  - name: Process
    title:
      en: Process
      nl: Process
    elements:
      - question: ProcessPreparationMethodology
      - question: ProcessExperimentalSkills
      - question: ProcessReliabilityReproducibility
      - question: ProcessInterpretingResults
      - question: ProcessIndependenceInitiative
      - question: ProcessCommunicationCollaboration
      - question: ProcessPlanningTimeManagement

  - name: Presentation
    title:
      en: Presentation
      nl: Presentatie
    elements:
      - question: PresentationContextualizationDelivery
      - question: PresentationClarityStyle
      - question: PresentationHandlingQuestions

  - name: FinalRemarks
    title:
      en: Final Remarks
      nl: Eindopmerkingen
    elements:
      - question: SummaryComments
      - question: Laudatio
      - question: ConsentExaminerName
        
onSubmit:
  - sendMail:
      template: AssessmentRequestAssessor
      to: SecondReviewer
