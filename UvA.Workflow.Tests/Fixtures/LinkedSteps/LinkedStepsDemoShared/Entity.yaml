name: LinkedStepsDemoShared
title: Shared thesis demo
titlePlural: Shared thesis demos
instanceTitle: '{{ Title }}'
steps: [Setup, Upload, Assess]
properties:
  - name: Title
    type: String!
  - name: Student
    type: '[User]!'
    text: Group members
    description: Select the three or four students who share the joint work.
  - name: Supervisor
    type: User!
    inheritRole: true
  - name: JointDocument
    type: File!
    text: Joint thesis PDF
  - name: JointCriterion1
    type: HalfGrade!
    text: Shared criterion 1
    control: Rubric
    calculation:
      type: Average
      weight: 1
    rubric:
      - name: Grade
        description: Demonstration criterion 1. Select a numeric grade.
        grades: ["10", "9,5", "9", "8,5", "8", "7,5", "7", "6,5", "6", "5,5", "5", "4,5", "4", "3", "2", "1"]
  - name: JointCriterion2
    type: HalfGrade!
    text: Shared criterion 2
    control: Rubric
    calculation:
      type: Average
      weight: 1
    rubric:
      - name: Grade
        description: Demonstration criterion 2. Select a numeric grade.
        grades: ["10", "9,5", "9", "8,5", "8", "7,5", "7", "6,5", "6", "5,5", "5", "4,5", "4", "3", "2", "1"]
  - name: JointCriterion3
    type: HalfGrade!
    text: Shared criterion 3
    control: Rubric
    calculation:
      type: Average
      weight: 1
    rubric:
      - name: Grade
        description: Demonstration criterion 3. Select a numeric grade.
        grades: ["10", "9,5", "9", "8,5", "8", "7,5", "7", "6,5", "6", "5,5", "5", "4,5", "4", "3", "2", "1"]
assessments:
  gradingBasis: Decimal
  gradeGap: false
  parts:
    - name: Assess
      title: Joint product
      weight: 1
      sources:
        - name: AssessJoint
fields:
  - property: Title
  - currentStep: true
infoCards:
  - name: Progress
    type: Progress
    title: Shared progress
  - name: Participants
    type: RelatedUsers
    title: Participants
    groups:
      - name: students
        title: Students
        users:
          - property: Student
      - name: staff
        title: Staff
        users:
          - property: Supervisor
