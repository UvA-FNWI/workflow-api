globalActions:
  - roles: [Student, Coordinator, Examiner, SecondAssessor, Supervisor, CoSupervisor]
    type: View
    forms: [Start, UploadFinalThesis]
  - roles: [Coordinator, Supervisor]
    type: View
    forms: [AssessmentSupervisor]
  - roles: [Coordinator, CoSupervisor, SecondAssessor, Supervisor]
    type: View
    forms: [AssessmentPresentation]
  - type: View
    roles: [Supervisor]
    forms: [AssessmentSecondAssessor]
    condition:
      event: AssessmentSupervisor
  - roles: [SecondAssessor]
    forms: [AssessmentSupervisor]
    condition:
      event: AssessmentSecondAssessor
  - roles: [Coordinator, Supervisor, SecondAssessor]
    type: View
    forms: [AssessmentCombined, FinalGrade, AssessmentPresentation]
  - roles: [Coordinator, SecondAssessor]
    type: View
    forms: [AssessmentSecondAssessor]
  - roles: [SystemAdmin]
    type: CreateInstance
    userProperty: Student
  - roles: [Coordinator]
    type: Edit
    forms: [Start]
  - roles: [Student]
    type: ViewResults
    forms: [AssessmentSupervisor, AssessmentSecondAssessor, AssessmentCombined]
    condition:
      event: FinalGrade
  - roles: [Student]
    type: View
    forms: [AssessmentPresentation]
    condition:
      event: FinalGrade