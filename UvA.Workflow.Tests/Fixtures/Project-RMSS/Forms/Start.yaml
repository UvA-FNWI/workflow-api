name: Start
step: Start
title:
  en: Proposal (student)
  nl: Voorstel (student)
  
pages:
  - name: Contents
    title:
      en: Proposal
      nl: Voorstel
    elements:
      - question: Title
      - question: EC
      - question: Topic
      - question: Description
  - name: Staff
    title:
      en: Staff
      nl: Begeleiding
    elements:
      - question: Supervisor
  - name: ResearchLocation
    title:
      en: Research location
      nl: Onderzoekslocatie
    elements:
      - question: PartAbroad
      - question: Country
      - question: City
      - question: ContactPersonEmail
      - question: ContactPersonDescription
      - question: EmergencyPhoneNumber
  - name: Planning
    title:
      en: Planning
      nl: Planning
    elements:
      - question: StartDate
      - question: PlannedEndDate

onSubmit:
  - serviceCall:
      service: Turnitin
      operation: CreateSubmission
      inputs:
        Owner: Student
        Title: Title
  - setProperty:
      property: TurnitinId
      value: CreateSubmission.Id
  - serviceCall:
      service: Turnitin
      operation: UploadFile
      inputs:
        SubmissionId: CreateSubmission.Id
        File: Description
  - delay: 1m
    serviceCall:
      service: Turnitin
      operation: GenerateReport
      inputs:
        SubmissionId: TurnitinId
  - sendMail:
      template: AssessmentRequestSupervisor
      to: Supervisor
